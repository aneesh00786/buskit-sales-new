plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.jrb.buskitSales"
    ndkVersion = "26.1.10909125"
    flavorDimensions "default"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    compileSdkVersion 36
    defaultConfig {
        applicationId "com.jrb.buskitSales"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
        release {
            storeFile = file("../../busskit-sales-release.jks") // adjust path
            storePassword = "buskit123"
            keyAlias = "busskit-sales-key"
            keyPassword = "buskit123"
        }
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildToolsVersion "34.0.0"
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }


    }
    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/proguard/*'
        exclude 'META-INF/LICENSE*'
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation 'com.stripe:stripe-android:20.34.+'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}