<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout</title>

  <script
    src="https://www.paypal.com/sdk/js?client-id=AQClUH-2qmN7z-AKcULb_uy5Zze1GEWNeWTDAFLRsvL0QUcNdIYNXebyqashLoXTkKWaPDR04HPbQeZs&disable-funding=credit,card,venmo&intent=authorize"></script>
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .dialog-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      box-sizing: border-box;
      padding: 16px;
      overflow-y: auto;
    }



    .top-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .top-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .apple-btn {
      background: black;
      color: white;
    }

    .paypal-btn {
      background: #ffc439;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ccc;
    }

    .divider:not(:empty)::before {
      margin-right: .75em;
    }

    .divider:not(:empty)::after {
      margin-left: .75em;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #stripe-card-element {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    .summary-row span {
      font-weight: bold;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #paypal-button-container,
    #paypal-error,
    #card-error {
      margin-top: 8px;
    }

    .title-container {
      background: linear-gradient(to right, #69c0ff, #a8dcfc);
      color: white;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      text-align: left;
    }

    #card-error,
    #paypal-error {
      color: red;
      font-size: 13px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2196f3;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="dialog-container">
    <div class="title-container">Add Card Details</div>
    <div class="top-buttons">
      <div id="apple-pay-button-container"></div>
      <div id="apple-pay-error" style="color: red; display: none;"></div>
      <div id="paypal-button-container"></div>
      <div id="paypal-error"></div>
    </div>
    <div id="paypal-spinner" style="display:none; text-align:center; margin-bottom: 10px;">
      <div class="spinner"
        style="width:30px; height:30px; border:4px solid #ccc; border-top:4px solid #0070ba; border-radius:50%; animation: spin 1s linear infinite;">
      </div>
    </div>

    <div class="divider">OR</div>

    <form id="card-form" class="form-group">
      <input type="text" id="cardName" placeholder="Card holder name" required />
      <div id="stripe-card-element"></div>
      <div id="card-error"></div>

      <div class="summary-row">
        <div>Ends on<br><span id="end-date">-</span></div>
        <div>
          Amount<br>
          $<span id="amount">-</span> USD
        </div>
        <div>Licenses<br><span id="licenses">-</span></div>
      </div>

      <div id="button-wrapper">
        <button type="submit" class="add-btn" id="submit-button">
          Add Card
        </button>
        <div id="loading-spinner" style="display: none; margin-top: 10px; text-align: center;">
          <div class="spinner"></div>
        </div>
      </div>

    </form>


  </div>

  <script>
    const stripe = Stripe('pk_test_f5u40cbDttJ0TfoPDP7ynfNM00XLdPmGKM');
    const elements = stripe.elements();
    const cardElement = elements.create('card', {
      hidePostalCode: true
    });
    cardElement.mount('#stripe-card-element');

    const urlParams = new URLSearchParams(window.location.search);
    const endDate = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });

    const amount = urlParams.get("amount") || "15.00";
    const licenses = urlParams.get("licenses") || "1";
    const adminId = urlParams.get("adminId") || 1;
    const planId = urlParams.get("planId") || 1;
    const currency = urlParams.get("currency") || "USD";

    document.getElementById("end-date").innerText = endDate;
    document.getElementById("amount").innerText = amount;
    document.getElementById("licenses").innerText = licenses;
    document.getElementById("card-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Show loading spinner and disable button
      const submitBtn = document.getElementById("submit-button");
      const spinner = document.getElementById("loading-spinner");
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";
      spinner.style.display = "block";

      try {
        const cardName = document.getElementById("cardName").value;

        const setupIntentRes = await fetch('https://thrivewoo.com/create-setup-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminId: adminId })
        });

        const jsonRes = await setupIntentRes.json();
        console.log("[DEBUG] create-setup-intent response:", JSON.stringify(jsonRes, null, 2));

        const { clientSecret, stripeCustomerId } = jsonRes;

        if (!clientSecret) {
          console.error("❌ Missing clientSecret:", jsonRes);
          document.getElementById("card-error").innerText = "Internal error. Try again later.";
          return;
        }

        const result = await stripe.confirmCardSetup(clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: { name: cardName }
          }
        });

        if (result.error) {
          document.getElementById("card-error").innerText = result.error.message;
        } else {
          const payload = {
            user_id: adminId,
            plan_id: planId,
            card_token: result.setupIntent.payment_method,
            end_date: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
            amount: amount,
            payment_method: 'card',
            status: 'trial',
            licenses: licenses,
            stripeCustomerId,
            currency
          };

          await fetch("https://thrivewoo.com/insert_transaction_and_subscription_details", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler("paymentSuccess", {
              orderId: result.setupIntent.payment_method,
              adminId, planId, amount, currency, licenses
            });
          }
        }
      } catch (err) {
        console.error("💥 Error in submission:", err);
        document.getElementById("card-error").innerText = err.message || "Something went wrong.";
      } finally {
        // Re-enable button and hide spinner
        submitBtn.disabled = false;
        submitBtn.innerText = "Add Card";
        spinner.style.display = "none";
      }
    });


    paypal.Buttons({
      createOrder: () => {
        document.getElementById("paypal-spinner").style.display = "block";

        return fetch("https://thrivewoo.com/create-paypal-auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount, adminId, currency })
        })
          .then(res => {
            console.log("[FRONTEND] Response status:", res.status);
            return res.json();
          })
          .then(data => {
            console.log("[FRONTEND] Received data:", data);
            if (!data.orderID) throw new Error("No orderID returned");
            return data.orderID;
          })
          .catch(err => {
            console.error("[FRONTEND ERROR] Failed to create PayPal order:", err);
            document.getElementById("paypal-error").innerText = "Error creating PayPal order.";
            document.getElementById("paypal-spinner").style.display = "none";
          });
      },

      onApprove: (data) => {
        const payload = {
          user_id: adminId,
          plan_id: planId,
          card_token: data.orderID,
          end_date: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
          amount,
          payment_method: 'pay-pal',
          status: 'trial',
          licenses,
          stripeCustomerId: '',
          currency
        };

        fetch("https://thrivewoo.com/insert_transaction_and_subscription_details", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(() => {
            if (window.flutter_inappwebview) {
              window.flutter_inappwebview.callHandler("paymentSuccess", {
                orderId: data.orderID,
                adminId, planId, amount, currency, licenses
              });
            }
          })
          .catch(err => {
            console.error("[FRONTEND ERROR] Failed to insert transaction:", err);
            document.getElementById("paypal-error").innerText = "Payment was successful but saving data failed.";
          })
          .finally(() => {
            document.getElementById("paypal-spinner").style.display = "none";
          });
      },

      onError: (err) => {
        console.error("💥 PayPal Error:", err);
        document.getElementById("paypal-error").innerText = "Something went wrong with PayPal.";
        document.getElementById("paypal-spinner").style.display = "none";
      }
    }).render('#paypal-button-container');
    document.getElementById('apple-pay-btn').addEventListener('click', async () => {
      document.getElementById('apple-pay-button-container').innerHTML = '';
      document.getElementById('apple-pay-error').style.display = 'none';

      await setupApplePay();
    });
    async function setupApplePay() {

      document.getElementById('apple-pay-button-container').innerHTML = '';
      document.getElementById('apple-pay-error').style.display = 'none';

      const planAmountEl = document.getElementById('plan_amount');
      if (!planAmountEl) {
        console.error("plan_amount not found in DOM");
        return;
      }

      const amountText = planAmountEl.textContent.replace(/[^\d.]/g, '');
      const amount = Math.round(parseFloat(amountText) * 100);

      const response = await fetch("https://thrivewoo.com/create_payment_intent", {

      });

      const { clientSecret, customerId } = await response.json();

      const paymentRequest = stripe.paymentRequest({

      if (!result || !result.applePay) {
        // document.getElementById('apple-pay-button-container').innerHTML =

      }

      const elements = stripe.elements();
      const prButton = elements.create('paymentRequestButton', {

        style: {

      });

        const { error, setupIntent } = await stripe.confirmCardSetup(clientSecret, {

        });
        console.log("SetupIntent result:", error, setupIntent);

        if (error) {
          ev.complete('fail');
          document.getElementById('apple-pay-error').textContent = error.message;
          document.getElementById('apple-pay-error').style.display = 'block';
        } else {
          ev.complete('success');
          const adminId = parseInt(localStorage.getItem("addressFind"));
          const licenses = document.getElementById('license_display')?.textContent || '1';
          const amount = parseFloat(document.getElementById('plan_amount')?.textContent.replace(/[^\d.]/g, '')) || 0;
          const end_date = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];

              throw new Error(saveResponse?.message || 'Failed to save subscription');
            }

            closepopup(subscription_plan_dialog);
            document.getElementById("trial_confirmation_message").textContent =
              "14-day trial started. Login credentials have been sent to your email.";
            document.getElementById("succsessbox").showModal();

            document.getElementById("go_to_login_btn").addEventListener("click", () => {
              document.getElementById("succsessbox").close();
              window.location.href = "/";
            }, { once: true });

          } catch (err) {
            document.getElementById('apple-pay-error').textContent = err.message;

          }
        }

    }
  </script>

</body>

</html>
