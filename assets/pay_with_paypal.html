<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>PayPal Checkout</title>
  <script
    src="https://www.paypal.com/sdk/js?client-id=AQClUH-2qmN7z-AKcULb_uy5Zze1GEWNeWTDAFLRsvL0QUcNdIYNXebyqashLoXTkKWaPDR04HPbQeZs&disable-funding=credit,card,venmo&intent=authorize">
    </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    .paypal-container {
      background-color: white;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 90%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .paypal-logo {
      height: 40px;
      margin-bottom: 12px;
    }

    .paypal-message {
      font-size: 18px;
      font-weight: bold;
    }

    #paypal-button-container {
      width: 100%;
    }

    #paypal-error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    .paypal-logo-box {
      background-color: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paypal-logo {
      width: 80px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="paypal-container">
    <div class="paypal-logo-box">
      <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal Logo" class="paypal-logo">
    </div>
    <span class="paypal-message">Secure Payment with PayPal</span>
    <p style="margin: 0; font-size: 14px; color: #555;">
      Your transaction is encrypted and protected by PayPal's secure gateway.
    </p>

    <div id="paypal-button-container"></div>
    <div id="paypal-error"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('paypal-button-container').innerHTML = '';
      document.getElementById('paypal-error').style.display = 'none';

      const urlParams = new URLSearchParams(window.location.search);
      const adminId = parseInt(urlParams.get("adminId"));
      const checkedID = parseInt(urlParams.get("planId"));
      const licenses = urlParams.get("licenses") || '1';
      const amount = parseFloat(urlParams.get("amount") || '0.00');
      const currencyCode = urlParams.get("currency") || "USD";

      paypal.Buttons({
        style: {
          layout: 'horizontal',
          color: 'gold',
          shape: 'rect',
          label: 'paypal',
          height: 50,
          tagline: false
        },
        createOrder: function (data, actions) {
          return fetch('https://thrivewoo.com/create-paypal-auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount,
              adminId,
              currency: currencyCode
            })
          }).then(res => {
            if (!res.ok) {
              return res.json().then(err => {
                throw new Error(err.error || 'Failed to create PayPal order');
              });
            }
            return res.json();
          }).then(data => {
            if (!data.orderID) throw new Error('Missing order ID');
            return data.orderID;
          });
        },
        onApprove: function (data, actions) {
          const end_date = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000)
            .toISOString().split("T")[0];

          const payload = {
            user_id: adminId,
            plan_id: checkedID,
            card_token: data.orderID,
            end_date: end_date,
            amount: amount,
            payment_method: 'pay-pal',
            status: 'trial',
            licenses: licenses,
            stripeCustomerId: '',
            currency: currencyCode
          };

          return fetch('https://thrivewoo.com/insert_transaction_and_subscription_details', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          })
            .then(async res => {
              const text = await res.text();
              if (!res.ok) throw new Error(`HTTP ${res.status} - ${text}`);
              let responseJson = JSON.parse(text);
              if (responseJson?.status_code !== 200) throw new Error(responseJson.message);

              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('paymentSuccess', {
                  orderId: data.orderID,
                  adminId,
                  planId: checkedID,
                  amount,
                  currency: currencyCode,
                  licenses
                });
              }

              const msgBox = document.getElementById("succsessbox");
              if (msgBox) {
                document.getElementById("trial_confirmation_message").textContent =
                  "14-day trial started. Login credentials have been sent to your email.";
                msgBox.showModal();
                document.getElementById("go_to_login_btn")?.addEventListener("click", () => {
                  msgBox.close();
                  window.location.href = "/";
                }, { once: true });
              }

            })
            .catch(err => {
              document.getElementById('paypal-error').textContent = err.message;
              document.getElementById('paypal-error').style.display = 'block';
            });
        },
        onError: function (err) {
          document.getElementById('paypal-error').textContent =
            'Payment failed. Please try again or use another payment method.';
          document.getElementById('paypal-error').style.display = 'block';
        }
      }).render('#paypal-button-container')
    });
  </script>
</body>

</html>
